apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: credit-scoring-fe-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/your-group/credit-scoring-new.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: credit-scoring-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
