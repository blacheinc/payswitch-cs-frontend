apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring-fe
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fe.example.com
      secretName: credit-scoring-fe-tls
  rules:
    - host: fe.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-fe
                port:
                  name: http
