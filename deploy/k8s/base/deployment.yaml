apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-fe
  labels:
    app.kubernetes.io/name: credit-scoring-fe
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: credit-scoring-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credit-scoring-fe
    spec:
      serviceAccountName: credit-scoring-fe
      containers:
        - name: frontend
          image: registry.example.com/credit-scoring/fe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: BACKEND_API_URL
              valueFrom:
                secretKeyRef:
                  name: credit-scoring-fe-secrets
                  key: BACKEND_API_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
